<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#252c2b" />
    <title>Verdant &amp; Co. — Architectural Heating &amp; Cooling</title>
    <meta name="description" content="Engineered climate solutions for distinctive American homes. Quiet operation, balanced airflow and immaculate installation craftsmanship." />
    <meta property="og:title" content="Verdant & Co. — Architectural Heating & Cooling" />
    <meta property="og:description" content="Comfort, thoughtfully delivered. Residential heating, cooling and air quality treated as an architectural discipline." />
    <meta property="og:type" content="website" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,300..600;1,6..72,300..500&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Enable the motion layer before first paint (prevents flash of un-animated content).
      if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        document.documentElement.classList.add('motion')
      }
    </script>
    <style>
      /* Boot screen — visible instantly, removed by React when ready */
      #boot{position:fixed;inset:0;z-index:9999;background:#252c2b;display:grid;place-items:center;color:#f9f7f2;font-family:'Newsreader',Georgia,serif}
      #boot span{font-size:clamp(28px,4vw,44px);letter-spacing:-.02em}
      html:not(.motion) #boot{display:none}
    </style>
  </head>
  <body>
    <div id="boot" aria-hidden="true"><span>VERDANT &amp; CO.</span></div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
